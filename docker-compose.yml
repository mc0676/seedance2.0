version: '3.8'

services:
  seedance:
    build:
      context: .
      target: backend
    image: seedance2.0:latest
    container_name: seedance-web
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 火山引擎 ARK 素材库凭证（首次部署自动写入 system_config）
      - VOLC_ACCESS_KEY_ID=${VOLC_ACCESS_KEY_ID:-}
      - VOLC_SECRET_ACCESS_KEY=${VOLC_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data:/app/server/data
      - ./dist:/app/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
