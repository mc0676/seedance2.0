version: '3.8'

services:
  seedance:
    build:
      context: .
      target: backend
    container_name: seedance-dev
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./server/index.js:/app/server/index.js
      - ./server/services:/app/server/services
      - ./server/database:/app/server/database
      - seedance-data:/app/server/data
    restart: unless-stopped
    command: node --watch server/index.js

volumes:
  seedance-data:
